<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Maintainer</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div id="app">
    <main id="main">
      <div id="topbar">
        <h1>Ficheiros</h1>
        <div id="topbar-actions">
          <button id="btn-refresh" type="button" title="Atualizar a lista de ficheiros">&#8635; Atualizar</button>
          <button id="btn-check-update" type="button">Verificar atualizações</button>
          <button id="btn-settings" type="button" title="Definições">&#9881; Definições</button>
          <button id="btn-sync-all" type="button">Copiar tudo para o servidor</button>
        </div>
      </div>
      <div id="searchbar">
        <input id="search-input" type="search" placeholder="Pesquisar ficheiro..." autocomplete="off">
      </div>
      <div id="file-list"></div>
      <div id="status-banner"></div>
    </main>
  </div>

  <div id="settings-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-header">
        <h3 id="settings-title">Definições das pastas</h3>
        <button id="settings-close" class="modal-close" type="button" aria-label="Fechar">&times;</button>
      </div>
      <label class="field">
        <span>Pasta original (onde edita os ficheiros) — pode ser uma pasta local ou de rede, ex.: \\servidor\pasta</span>
        <div class="modal-row">
          <input id="input-original-dir" type="text" autocomplete="off">
          <button id="btn-pick-original" type="button" class="btn-secondary">Escolher pasta...</button>
        </div>
      </label>
      <label class="field">
        <span>Pasta do servidor (destino da cópia) — também pode ser de rede, ex.: \\servidor\pasta</span>
        <div class="modal-row">
          <input id="input-server-dir" type="text" autocomplete="off">
          <button id="btn-pick-server" type="button" class="btn-secondary">Escolher pasta...</button>
        </div>
      </label>
      <p id="settings-error" class="modal-error" hidden></p>
      <div class="modal-actions">
        <button id="settings-cancel" class="btn-secondary" type="button">Cancelar</button>
        <button id="settings-save" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
